# Стрейф (режимы 1, 2, 3 ходьбы в прицеле; 13.10 - и поза рук режима 4) - живые настройки. Игра перечитывает этот файл на ходу (за полсекунды).
# Что играет на каждом направлении движения относительно корпуса:
#   имена анимаций набора: BL BR FL FR L45 R45 L135 R135 F B;  own_fwd / own_back - её родная ходьба вперёд / назад
#   m перед именем - зеркальная копия (mBL - «влево», отражённое вправо)
# 13.10: все направления - анимации набора как есть (перенесены заново: стопы как в записи, подогнаны только рост и шаг).
# Вбок два варианта: dir.R / dir.L - отстающая нога проходит спереди (в смеси с диагональю вперёд),
#   dir.R_B / dir.L_B - нога сзади (в смеси с диагональю назад); смесь «нога спереди» с «назад по диагонали» сводила голени.
#   прежние варианты (до 13.10): вправо FR, влево mFR, вперёд-влево mR45
dir.F  = own_fwd
dir.FR = R45
dir.R  = FR
dir.R_B = BR
dir.BR = R135
dir.B  = own_back
dir.BL = L135
dir.L  = FL
dir.L_B = BL
dir.FL = L45
# смена варианта вбок (спереди <-> сзади): смесь за столько секунд, в той части шага, где ноги далеко друг от друга
lat_xfade = 0.2
lat_hyst = 2
# 13.10 поздний вечер (2): анимация - сразу по направлению (вправо - вправо, назад - назад), вариант
# бока - по сектору, без ожидания на боку и без доворота ног под него; ровно на боку - нога спереди
# (dir.R / dir.L), сзади (dir.R_B / dir.L_B) - только ближе к «назад по диагонали». lat_wait 1 - как
# было: пока вариант не тот, поза ждёт на боку, разницу до направления добирает поворот ног (warp)
lat_wait = 0
# догон позы до направления (квантов в секунду, 4096 - полный круг): после ожидания на боку (lat_wait 1)
# и после режима 3 «влево» за боком (m3_left_hold)
lat_catch = 2500
# ширина смешивания соседних направлений: 1 - плавно на весь угол 45°, 0.3 - смесь только посередине, иначе чистая анимация
blend = 1.0
# поворот таза и ног под направление шага (остаток между направлениями круга): 1 - полностью, 0 - выкл.
# При lat_wait 0 это только постоянное смещение перекрестия от камеры (~10-20°): стопы идут по шагу
warp = 1
# направление ног на круге - от камеры (клавиши попадают ровно в 8 направлений, перекрестие правее камеры на ~10°): 1 - да, 0 - от корпуса
legs_cam = 1
# свой разворот таза анимаций набора относительно её ходьбы: 1 - как в анимации (у шага вбок до 43°), 0 - как у её ходьбы
pelvis_twist = 0.4
# 13.10: своя доля для анимации: pelvis_twist.<имя>; у BL доворот при стопах на месте сводит колени - у неё почти как в записи
pelvis_twist.BL = 0.9
# 13.10: стопы анимации стоят на месте, когда таз доворачивается и рост подгоняется (IK ног): 1 - да, 0 - выкл
foot_lock = 1
# 13.10: рост анимаций набора - под её ходьбу с текущим оружием (дробовик ниже пистолета на ~2 см): 1 - да, 0 - как с пистолетом
height_fit = 1
# сдвиг фазы анимации в кадрах (если стопы в смеси ставятся не одновременно): phase.BL = 0  и т.п.
# как быстро ноги уходят в стойку прицела при остановке и обратно (доля скорости в секунду; 4 - за ~0.25 с, 8 - за ~0.13 с)
stance_rate = 4
# разгон ног в шаг (доля в секунду) и разворот больше 100°: ноги сначала к стойке со скоростью flip_rate, там меняют сторону
rise_rate = 4
flip_rate = 4
# пружины: направление ног, курс шага (больше - быстрее), доля ровного корпуса
dir_omega = 40
turn_omega = 14
torso_omega = 10
torso_steady = 1.0
# скорость шага: вбок/по диагонали (доля её шага вперёд), назад
speed_side = 1.0
speed_back = 0.78
# разворот больше 100°: торможение и разгон, в развёртках (60 в секунду)
brake = 15
accel = 12
# ноги шире, градусы наружу на каждое бедро: spread.<анимация> или spread для всех (для зеркальной - с приставкой: spread.mBL)
# 13.10: с анимациями как в записи не нужно (прежде было spread.L45 = 2.5, spread.BR = 2.5)
# поворот корпуса к перекрестию на ходу (квантов в секунду, 4096 - полный круг) и его разгон
body_rate = 2693
body_accel = 30000
# 13.10: выстрел на ходу - корпус к перекрестию быстрой кривой (квантов в секунду и разгон); игра стреляет, когда корпус ближе
# fire_tol градусов к перекрестию (не дольше fire_wait кадров, 60 в секунду)
fire_turn_rate = 5400
fire_turn_accel = 60000
fire_tol = 12
fire_wait = 18
# режим 2 (= 1 + доворот): на шаге вбок корпус доворачивается в сторону шага на столько градусов (по диагонали - на 0.7 от этого)
lean = 25
# 13.10 днём номера режимов переставлены: 3 - корпус остаётся повёрнутым к шагу (был 5); потом прежние 4 и 5 убраны, 4 - новый:
# как 0, на ходьбе камера как без прицела и нет перекрестия. Ключи m4_pose_big, m4_pose_small, m5_side, m5_blend ниже - от
# убранных прежних режимов, не действуют (новый 5 с 13.10 поздним вечером - свои ключи m5_* в конце файла)
# 13.10 поздний вечер (4): режим 6 - в прицеле как 3 (ключи режима 3 - и для него), без прицела как 5;
# на ходьбе в прицеле камера как без прицела (как в 4 и 5)
# режим 3: доля скорости поворота на ходу; поворот больше big_turn градусов плавно (за big_ramp секунд) разгоняется до скорости оригинала
walk_turn = 0.5
big_turn = 60
big_ramp = 0.25
# (убран) режим 4: поворот с места больше m4_pose_big градусов - поза рук походки не сразу, а по ходу поворота (полностью к m4_pose_small)
m4_pose_big = 60
m4_pose_small = 20
# (убран прежний) режим 5 (= 4, влево и вправо - стрейф): стрейф на ±m5_side градусов от «вбок» (направление от камеры), дальше m5_blend - плавный переход
m5_side = 20
m5_blend = 20
# режим 3 (корпус остаётся повёрнутым к шагу): поворот корпуса от камеры, градусы - вбок m3_side, назад по диагонали m3_back
# (вперёд по диагонали - 45, лицом по шагу; назад - 0, пятится; между - по прямой)
m3_side = 55
m3_back = 35
# 13.10 день (3): режим 3, ходьба назад-влево - «влево» (dir.L, FL: таз к шагу) вместо смеси BL и L135 (таз был на ~41° правее
# корпуса, стало ~17° левее, как у «влево» в режиме 1): пока ноги не дальше m3_left_hold градусов за боком, поза стоит на боку,
# остаток - поворотом ног; со старта с места (корпус ещё поворачивается) - до m3_left_start градусов, не дольше m3_left_time
# секунд. m3_left_hold = 0 и m3_left_start = 0 - как было
m3_left_hold = 30
m3_left_start = 60
m3_left_time = 0.6
# 13.10 поздний вечер (4): ноги ушли дальше m3_left_hold - поза с бока к направлению ног плавно за m3_left_release
# секунд (было за один такт: таз с ногами на 50° за кадр на «влево -> назад»). 0 - как было
m3_left_release = 0.3
# и цель шага (куда пойдут ноги, когда корпус довернётся) - в той же зоне, назад-влево; ноги лишь проходят её
# («влево -> назад») - поза не держится на боку (держалась 0.1-0.2 с, таз качался влево и обратно). 0 - как было
m3_left_goal = 1
# 13.10 поздний вечер (5), только режим 6: средний курс таза ног (смесь клипов и поворот ног под шаг) ведёт пружина
# m6_pelvis_omega (больше - быстрее; 0 - как в 3): таз не прыгает на смене варианта бока (нога спереди / сзади: слева 55°,
# справа 28°) и на проходе бока при переборе клавиш; ноги и стопы - как в клипах, качание таза в шаге - как было.
# m6_pelvis_max - на сколько градусов таз может отстать от клипа (мягко)
m6_pelvis_omega = 8
m6_pelvis_max = 45
# 13.10 поздний вечер (6), режимы 1-3 и 6: прицел нажат во время быстрого разворота (стик назад) - разворот
# останавливается там, куда успел, и дальше она поворачивается к прицелу своей скоростью (как поворот корпуса
# в прицеле), без поворота за кадр. 0 - разворот доигрывается до конца, потом так же своей скоростью
aim_qt_stop = 1
# Режим 3: смена варианта бока (нога спереди / сзади) идёт только
# в своей фазе шага (иначе голени проходят друг сквозь друга).
# m3_wait_dip больше нуля: если направление за это время ушло от
# бока дальше стольких градусов, ноги ныряют в стойку (шаг игры
# не ниже m3_wait_speed). 13.10 поздний вечер: 0 - нырка нет, как
# и было у игрока (до вечера ключ читался как 0).
m3_wait_dip = 0
m3_wait_speed = 0.5
# 13.10 поздний вечер: таз с ногами не дальше tw_max градусов от
# корпуса (верхнего торса), без проворота. tw_knee: последние
# столько градусов подход к пределу мягкий. tw_hold: за 180° таз
# держит прежнюю сторону ещё столько градусов. tw_jump: цель
# прыгнула больше стольких градусов за такт (смена стороны) -
# переход за tw_blend секунд через «прямо». tw_max 0 - выкл.
tw_max = 90
tw_knee = 15
tw_hold = 30
tw_jump = 60
tw_blend = 0.4
# 13.10 день (3): режим 4 - поза рук походки (пистолет к себе и вверх), пока нажато направление, сразу и на повороте с места;
# голова - как у игры. m4_pose_omega - скорость перехода рук (16: 90 % за 0.24 с; больше - быстрее). Выстрел ждёт, пока руки
# вернутся к позе игры ближе fire_arm_tol градусов (не дольше fire_wait кадров)
m4_pose_omega = 16
fire_arm_tol = 6
# 13.10 вечер: режим 4 - противоположное направление (поворот от m4_qt_deg градусов, шла вправо -
# нажал влево): быстрый разворот в темпе родного разворота игры (180° за 0.4 с), но плавно:
# разгон m4_qt_accel (квантов в секунду за секунду), потолок m4_qt_rate (квантов в секунду,
# 4096 - полный круг; больше 8500 нельзя), торможение по кривой. Остальные повороты - как в 0.
# m4_qt_deg 0 - выкл
m4_qt_deg = 150
m4_qt_rate = 7800
m4_qt_accel = 51200
# 13.10 поздний вечер (3): режим 3 на ходу - разгон и торможение поворота корпуса к шагу (квантов в
# секунду за секунду). Было body_accel 30000: смена направления поворота за 1-2 такта читалась дрожью тела
m3_body_accel = 10000
# режимы 4 и 5: голову ведёт пружина к голове игры (обрыв перехода походка/стойка - плавно);
# m4_head_omega - её скорость (14: 90 % за 0.28 с; больше - быстрее); m4_head_smooth 0 - голова как у игры
m4_head_smooth = 1
m4_head_omega = 14
# без прицела (13.10 поздний вечер (3) - в режиме 5, с (4) - во всех режимах, run_turn_walk = 1; 0 - только в 5 и 6):
run_turn_walk = 1
# бежит и поворачивает больше m5_walk_turn градусов - бег отпускается (шагом),
# до цели меньше m5_run_turn - снова бег. Шаг в этом повороте медленнее: доля 1 до m5_slow_from
# градусов ошибки курса, m5_slow_min от m5_slow_full, между - плавно; падает не быстрее m5_slow_down,
# растёт не быстрее m5_slow_up в секунду. m5_keep_frames - сколько кадров без шага ещё считается
# «бежит». Шагом без бега и с места - как было: встаёт, доворачивается, идёт
m5_walk_turn = 50
m5_run_turn = 20
m5_slow_from = 30
m5_slow_full = 90
m5_slow_min = 0.75
m5_slow_down = 3
m5_slow_up = 2
m5_keep_frames = 6
