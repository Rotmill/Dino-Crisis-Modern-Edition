; CONTROLLER LAYOUT
;
; A PlayStation button counts as pressed when ANY source listed for it is
; pressed. Sources use SDL / Xbox names:
;
;   a, b, x, y, back, start, leftstick, rightstick, leftshoulder,
;   rightshoulder, lefttrigger, righttrigger, dpup, dpdown, dpleft, dpright,
;   leftx-, leftx+, lefty-, lefty+
;
; The default layout follows the modern Resident Evil games rather than the
; 1999 original: aim on the left trigger, fire on the right, interact on A.
; Edit the lines below to taste, or use the settings menu (Select) - it writes
; its own file and does not touch this one.
;
; The Controls Layout screen (at start-up, and in the settings menu under
; CONTROLS) reads this file: remap a button here and the gamepad page shows
; the new layout. Aim (L2), fire (R2), action (A), run / back (B), run on L3,
; movement and camera are handled by the mod itself, not by a button mapping;
; the settings menu has a Run Type option for L3, and quick-turn is R3.
; L1 and R1 repeat L2 and R2: the leftshoulder / rightshoulder sources below
; are ignored (set DC_SHOULDER_DUP=0 in dc_env.cfg for the old L1 = switch target).
; Empty means the button is not bound to the pad at all.

[controller]
enabled  = true
device   = 0
deadzone = 12000

[mapping]
; movement - stick or d-pad
up    = dpup,lefty-
down  = dpdown,lefty+
left  = dpleft,leftx-
right = dpright,leftx+

; action
cross    = a,righttrigger     ; interact, and fire while aiming
circle   = y                  ; items and map
square   = x                  ; run while held
triangle =                    ; back, on the game's own screens
l1       = leftshoulder       ; switch target (only with DC_SHOULDER_DUP=0)
r1       = lefttrigger        ; aim
l2       =
r2       =

; system
start  = start                ; pause
select = back                 ; settings menu
