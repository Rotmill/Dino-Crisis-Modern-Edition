# Dino Crisis ME - startup settings.
#
# Built into DinoCrisisME.exe (setup packs it into dcme_data.pak; since
# 17.09.2026 it is no longer a file in the data folder). The game applies it
# before anything else. Every line is a default: a variable already set in the
# environment wins, so `set DC_WIDESCREEN=0` in a console still overrides it.
#
# Most of it is also reachable from the in-game settings menu (Select on a pad,
# Backspace on the keyboard), which writes data\dc_user.cfg - and dc_user.cfg
# wins over these values.
#
# Without a line the framework's own default applies - which, for the three in
# "picture" below, means the mod is off and the picture is the original one.

# ---- picture --------------------------------------------------------------
DC_GPU_RASTER  = 1
DC_GPU_SCALE   = 5
DC_WIDESCREEN  = 1
DC_TWO_SIDED   = 1
DC_VSYNC       = 1
DC_FONT_ATLAS  = 0
DC_TITLE_TEXT  = 0

# ---- rooms ----------------------------------------------------------------
DC_ROOM_LIBRARY = exported_rooms\library
DC_ROOM_LIVE    = 1
DC_ROOM_SHOWALL = 1
DC_SEMI_STAT    = 1

# How long a scripted scene must run before the skip prompt appears.
# The framework default is 4000, which felt like a wait; 1200 is the
# value tuned while playing.
DC_SKIP_MIN_MS  = 1200

# ---- camera and Regina ----------------------------------------------------
DC_NATIVE_OTS    = 1
DC_NOTS_SHOULDER = 300
DC_CAM_MESH_COLL = 0
DC_CAM_GAMECOLL  = 0
DC_CUTSCENE_CAMS = cutscene_cams.txt
DC_NO_WALL_TURN  = 1
DC_FF_CAMCUT     = 0
DC_OTS_RAMSKEL   = 1
DC_RAMSKEL_MAP   = 0,1,2
DC_POOL_GEOM     = 1
DC_BODY_DIRECT   = 1

# ---- light and post-processing (V3, 04.10.2026) ---------------------------
# Sync with the dev launch folder's run_dc_hle.bat chain, variable by variable:
# these are the only values it sets that V1 did not carry. The rest of what
# came after V1 (faces, jaw and lips, SPU reverb and Gaussian interpolation,
# materials, glow, haze, two-sided marks, room rules...) is on by default in
# the code itself and needs no line here.
DC_LIGHT_GTE   = 1
DC_LIGHT_DBG   = 0
DC_SHADOW      = 1
DC_SHADOW_ON   = 1
DC_SSAO        = 1
DC_MSAA        = 4

# ---- diagnostics ----------------------------------------------------------
# All off. A release writes no log and no diagnostic files at all (17.09.2026):
# the Vulkan and rasteriser logs, the movement recorder, the freeze heartbeat
# and the crash reports are compiled out or tied to a switch that is always off.
DC_DIAG_LOG        = 0
DC_NO_FREEZE_DUMP  = 1
DC_RING            = 0
DC_YAW_TRACE       = 0
DC_FADE_DUMP_MAX   = 600
DC_AUTOLOAD        = 0
DC_SS_RESET_SIO    = 0
DC_SIO_STORM       = 0
DC_DBG_PRIM        = 0
